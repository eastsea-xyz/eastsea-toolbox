# native/ — EastSea-native templates (Lane B: claims, streams, escrow;
# Lane C: token probes, swap pool).
#
# Separate from contracts/ (the published examples) and from originals/
# (unchanged upstream code). EastSea executes revm at the Osaka spec
# (proof/foundry.toml), so the native templates compile for osaka and use
# transient storage for their reentrancy locks.
#
# Each item keeps its own src/ and test/ folders: native/<item>/{src,test}.
# out/ and cache/ stay inside native/ and are gitignored by the root rule.

[profile.default]
src = "."
test = "."
script = "script"
out = "out"
cache_path = "cache"
libs = ["../contracts/lib"]
remappings = [
    "forge-std/=../contracts/lib/forge-std/src/",
    "openzeppelin/=../contracts/lib/openzeppelin-contracts/contracts/",
    "toolbox-personal/=../contracts/src/common/",
]
solc_version = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
# Foundry lifts EIP-170 for test deployments; test contracts need that. Each
# item instead asserts its deployed runtime stays within EastSea's 24,576 B.
fs_permissions = [{ access = "read", path = "./claims/test/fixtures" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 1000

[lint]
# `1 << n` is the intended order in bitmap code; vesting and escrow deadlines
# are wall-clock by design (see each SECURITY.md); tests use deliberate casts.
exclude_lints = ["incorrect-shift", "block-timestamp"]
ignore = ["*/test/*.sol", "*/test/sim/*.sol", "common/test/*.sol"]
